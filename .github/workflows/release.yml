name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
      - run: python scripts/download_core.py
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Frozen app smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/QingzhouAIStation/QingzhouAIStation.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw 'Desktop application exited during startup' }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "轻舟 AI 中转站 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
